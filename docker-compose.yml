services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
  web:
    build: { context: ./frontend }
    ports: ["3000:3000"]
    environment:
      - API_INTERNAL_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on: [api]
